name: joyeria_bejeweled
description: "BEJEWELED — App de e-commerce de joyería, con el mismo diseño (lila y dorado) que la versión web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  translator: ^1.0.4+1
  http: ^1.2.2
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Si agregan imágenes locales de productos, descomenten y ajusten:
  # assets:
  #   - assets/imagenes/